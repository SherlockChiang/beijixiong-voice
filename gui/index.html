<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beijixiong Voice</title>
    <link rel="stylesheet" href="/gui/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div class="brand">
            <p class="eyebrow">Local Bark TTS</p>
            <h1>北极熊口音生成器</h1>
          </div>
          <div class="top-actions">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换夜间模式">
              <span id="themeIcon">☾</span>
            </button>
            <div class="status" id="status">Ready</div>
          </div>
        </header>

        <div class="layout">
          <section class="composer">
            <label class="field">
              <span>文本</span>
              <textarea id="text" spellcheck="false">大家好，我是北极熊。今天我来读中文。</textarea>
            </label>

            <div class="actions">
              <button class="secondary" id="previewBtn" type="button">预览 Prompt</button>
              <button class="primary" id="generateBtn" type="button">生成音频</button>
            </div>

            <div class="progress-wrap" id="progressWrap" hidden>
              <div class="progress-head">
                <span id="progressLabel">准备生成</span>
                <b id="progressValue">0%</b>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
              </div>
            </div>

            <section class="result">
              <div class="result-head">
                <span>Prompt</span>
                <button class="ghost" id="copyBtn" type="button">复制</button>
              </div>
              <pre id="prompt">等待预览...</pre>
              <audio id="audio" controls hidden></audio>
            </section>

            <section class="library">
              <div class="result-head">
                <span>生成记录</span>
                <button class="ghost" id="refreshBtn" type="button">刷新</button>
              </div>
              <div id="audioList" class="audio-list"></div>
            </section>
          </section>

          <aside class="controls">
            <label class="field compact">
              <span>音色</span>
              <select id="voice"></select>
            </label>

            <label class="field compact">
              <span>情绪</span>
              <select id="emotion"></select>
            </label>

            <div class="grid">
              <label class="field compact">
                <span>Seed</span>
                <input id="seed" type="number" />
              </label>
              <label class="field compact">
                <span>分段</span>
                <input id="maxChars" type="number" min="40" step="10" />
              </label>
            </div>

            <label class="field compact">
              <span>文本温度 <b id="textTempValue"></b></span>
              <input id="textTemp" type="range" min="0.35" max="0.9" step="0.05" />
            </label>

            <label class="field compact">
              <span>波形温度 <b id="waveformTempValue"></b></span>
              <input id="waveformTemp" type="range" min="0.35" max="0.9" step="0.05" />
            </label>

            <label class="field compact">
              <span>语速/升调 <b id="speedPitchValue"></b></span>
              <input id="speedPitch" type="range" min="0.9" max="1.3" step="0.01" />
            </label>

            <label class="field compact">
              <span>最大停顿 <b id="maxPauseValue"></b></span>
              <input id="maxPauseMs" type="range" min="80" max="500" step="10" />
            </label>

            <label class="field compact">
              <span>静音阈值 <b id="silenceThresholdValue"></b></span>
              <input id="silenceThresholdDb" type="range" min="-60" max="-25" step="1" />
            </label>

            <label class="field compact">
              <span>文件名</span>
              <input id="outputName" value="beijixiong" />
            </label>
          </aside>
        </div>
      </section>
    </main>

    <script src="/gui/app.js"></script>
  </body>
</html>
