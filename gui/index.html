<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beijixiong Voice</title>
    <link rel="stylesheet" href="/gui/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div class="brand">
            <p class="eyebrow">Local F5-TTS</p>
            <h1>北极熊口音生成器</h1>
          </div>
          <div class="top-actions">
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换夜间模式">
              <span id="themeIcon">☾</span>
            </button>
            <div class="status" id="status">Ready</div>
          </div>
        </header>

        <div class="layout">
          <section class="composer">
            <label class="field">
              <span>文本</span>
              <textarea id="text" spellcheck="false">大家好，我是北极熊。今天我来读中文。</textarea>
            </label>

            <div class="actions">
              <button class="secondary" id="promptBtn" type="button">生成口音 Prompt</button>
              <button class="primary" id="generateBtn" type="button">生成音频</button>
            </div>

            <div class="progress-wrap" id="progressWrap" hidden>
              <div class="progress-head">
                <span id="progressLabel">准备生成</span>
                <b id="progressValue">0%</b>
              </div>
              <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
              </div>
            </div>

            <section class="result">
              <div class="result-head">
                <span>口音 Prompt</span>
                <button class="ghost" id="copyBtn" type="button">复制</button>
              </div>
              <textarea id="prompt" spellcheck="false" rows="7" placeholder="先点击生成口音 Prompt，也可以在这里手动修改后再生成音频。"></textarea>
              <audio id="audio" controls hidden></audio>
            </section>

            <section class="library">
              <div class="result-head">
                <span>生成记录</span>
                <button class="ghost" id="refreshBtn" type="button">刷新</button>
              </div>
              <div id="audioList" class="audio-list"></div>
            </section>
          </section>

          <aside class="controls">
            <label class="field compact">
              <span>角色</span>
              <div class="select-row">
                <select id="character"></select>
                <button class="mini danger" id="deleteCharacterBtn" type="button" title="删除当前角色的所有参考">删</button>
              </div>
            </label>

            <label class="field compact">
              <span>情绪</span>
              <div class="select-row">
                <select id="emotion"></select>
                <button class="mini danger" id="deleteEmotionBtn" type="button" title="删除当前情绪参考">删</button>
              </div>
            </label>

            <div class="ref-preview" id="refPreview">
              <div class="ref-meta">
                <span id="refFileLabel">--</span>
                <span id="refTextLabel">--</span>
              </div>
              <audio id="refAudio" controls></audio>
            </div>

            <label class="field compact">
              <span>推理速度 <b id="speedValue"></b></span>
              <input id="speed" type="range" min="0.5" max="2.5" step="0.05" />
            </label>

            <label class="field compact">
              <span>语速/升调 <b id="speedPitchValue"></b></span>
              <input id="speedPitch" type="range" min="0.9" max="1.3" step="0.01" />
            </label>

            <label class="field compact">
              <span>最大停顿 <b id="maxPauseValue"></b></span>
              <input id="maxPauseMs" type="range" min="0" max="500" step="10" />
            </label>

            <label class="field compact">
              <span>静音阈值 <b id="silenceThresholdValue"></b></span>
              <input id="silenceThresholdDb" type="range" min="-60" max="-25" step="1" />
            </label>

            <label class="field compact">
              <span>文件名</span>
              <input id="outputName" value="beijixiong" />
            </label>

            <label class="field compact">
              <span>口音强度 <b id="accentIntensityValue"></b></span>
              <input id="accentIntensity" type="range" min="1" max="4" step="1" />
            </label>

            <details class="upload-section">
              <summary>上传参考音频</summary>
              <label class="field compact">
                <span>角色名</span>
                <input id="uploadCharacter" placeholder="luna" />
              </label>
              <label class="field compact">
                <span>情绪名</span>
                <input id="uploadEmotion" placeholder="angry" />
              </label>
              <label class="field compact">
                <span>参考文本（可选）</span>
                <textarea id="uploadRefText" rows="2" placeholder="参考音频中说的话，留空会自动转录（首次较慢）"></textarea>
              </label>
              <label class="field compact">
                <span>音频文件</span>
                <input id="uploadFile" type="file" accept=".wav,.mp3,.flac,.ogg,.m4a" />
              </label>
              <button class="secondary" id="uploadBtn" type="button">上传</button>
            </details>
          </aside>
        </div>
      </section>
    </main>

    <script src="/gui/app.js"></script>
  </body>
</html>
